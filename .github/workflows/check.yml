name: check

# Disabled: workflows do not run under the account this repository lives on, so an automatic
# trigger queues forever and silently blocks anything waiting on it. Uncomment the block below if
# you fork this repository to an account with Actions enabled.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The build validates the environment schema, and `DATABASE_URL` is the one required
      # variable. A literal path rather than a secret because nothing here opens the file — the
      # build only needs the schema to be satisfiable, and a runner has no database to point at.
      DATABASE_URL: data/creator-site.db

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # One step, not six. `gate` is the same command run locally before anything is claimed to
      # work, so CI cannot drift from it: format check, strict lint, audit, build, type check, and
      # the tests — unit, browser and Playwright. (The build comes before the type check because
      # Paraglide's messages and SvelteKit's types do not exist in a fresh checkout, and
      # svelte-check flags every import of them.)
      #
      # There is deliberately no separate e2e step or input: `gate` runs `test`, which runs the
      # Playwright suite, and an opt-in step on top of that only ran it twice.
      - run: npm run gate
